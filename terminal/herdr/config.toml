onboarding = false

[keys]
clear_pane = "prefix+ctrl+k"
last_pane = "prefix+l"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
swap_pane_left = "prefix+shift+left"
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"
detach = "prefix+q"

[[keys.command]]
key = "prefix+shift+q"
type = "shell"
command = '"$HERDR_BIN_PATH" server stop'
description = "Stop Herdr and all panes"

[[keys.command]]
key = "prefix+a"
type = "popup"
command = 'zsh "$HOME/.config/herdr/picker.zsh" agents'
width = 76
height = 12
description = "Navigate agents"

[[keys.command]]
key = "prefix+w"
type = "popup"
command = 'zsh "$HOME/.config/herdr/picker.zsh" spaces'
width = 76
height = 12
description = "Navigate spaces"

[ui]
agent_panel_sort = "priority"
copy_on_select = true
mouse_scroll_lines = 1

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "workspace"], ["state_text", "agent"]]

[ui.toast]
delivery = "terminal"
